[project]
name = "eeg-video-sync"
version = "1.0.0"
description = "ULTRA-FAST EEG-video synchronization tool for OpenBCI and GoPro recordings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]
video = [
    "ultralytics>=8.3.0",
    "supervision>=0.21.0",
]
gaze = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "Pillow>=9.0.0",
]
pose3d = [
    "rtmlib",
]
portal = [
    "eeg-video-sync[video,pose3d,gaze]",
    "boxmot>=18.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
eeg-sync = "sync_eeg_vid.cli:main"
eeg-sync-portal = "portal.app:main"
video-processing-portal = "portal.app:main"
video-infer-sam3d = "video_inference.sam3d_runner:main"
video-infer-ultralytics = "video_inference.ultralytics_runner:main"
video-infer-rtmlib = "video_inference.rtmlib_runner:main"
video-infer = "video_inference.pipeline:main"
video-compress-rapid = "video_inference.rapid_compress:main"
video-interpolate = "video_analysis.interpolate:main"
video-visualize = "video_analysis.visualize_pose_tracks:main"
video-smooth = "video_analysis.temporal_smooth:main"
video-visualize-3d = "video_analysis.visualize_pose_3d:main"
video-annotate-tracks = "video_analysis.track_annotator:main"
video-correct-tracks = "video_analysis.track_correction:main"
video-filter-tracks = "video_analysis.track_filter:main"
gaze-infer = "gaze_analysis.page_runner:main"
gaze-infer-gazelle = "gaze_analysis.gazelle_runner:main"
gaze-label-eval = "gaze_analysis.label_eval:main"
video-assoc = "video_inference.offline_assoc:main"
video-refine-keypoints = "video_inference.topdown_refine:main"
video-session-report = "video_analysis.session_report:main"
eeg-red-light = "sync_eeg_vid.red_light:main"
gaze-synchrony = "gaze_analysis.synchrony:main"
gaze-plot = "gaze_analysis.plotting:main"
video-pose-metrics = "video_analysis.pose_metrics:main"
video-gaze-metrics = "video_analysis.gaze_metrics:main"
video-anchor-frames = "video_analysis.anchor_frames:main"
video-gaze-snapshots = "video_analysis.gaze_snapshots:main"
pose-train-preflight = "pose_training.preflight:main"
pose-train-sample = "pose_training.sampling:main"
pose-train-pseudo-label = "pose_training.pseudo_label:main"
pose-train-dataset = "pose_training.dataset:main"
pose-train-fit = "pose_training.train:main"
pose-train-eval = "pose_training.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["sync_eeg_vid", "video_inference", "video_analysis", "gaze_analysis", "portal", "pose_training"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/felipeparodi/eeg_sync"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["third_party"]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)
per-file-ignores = {"tests/*" = ["E402"], "video_inference/pipeline.py" = ["N806"]}

[tool.black]
line-length = 88
target-version = ["py310"]
exclude = "third_party"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "smoke: end-to-end tests that run real inference. Enable with RUN_SMOKE_TESTS=1.",
]

[tool.coverage.run]
source = ["sync_eeg_vid", "video_inference", "video_analysis", "gaze_analysis"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
